name: Build + publish SimForge container

# Builds the SimForge Docker image and publishes it to GitHub Container
# Registry (GHCR) at ghcr.io/phanidharakula/simforge. Closes plan
# §1.10 Objective 3 (containerized execution) + §1.11 C3 (pinned-digest
# reproducibility) + §2.7 (OCI / Singularity).
#
# Triggers:
#   - Push to phase-14-canonical-routes branch: builds + tags as the
#     branch name + the commit SHA.
#   - Push to main: builds + tags as `latest` + `main` + SHA.
#   - Manual dispatch: builds + tags as <branch>-manual + SHA.
#
# Cardinal pull (after this workflow lands an image):
#   singularity pull docker://ghcr.io/phanidharakula/simforge:latest
#   # or pin by SHA for reproducibility:
#   singularity pull docker://ghcr.io/phanidharakula/simforge:<sha>
#
# See doc/CONTAINER_USAGE.md for the full pull + bind-mount + run workflow.

on:
  push:
    branches:
      - main
      - phase-14-canonical-routes
    paths-ignore:
      - 'doc/**'
      - '*.md'
      - 'tests/**'
      - 'cluster/**'
      - 'runspecs/**'
      - 'scripts/**'
      - 'lib/container/manifest.json'  # metadata only, doesn't change image content
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          # Owner needs to be lowercase for GHCR
          REPO_LOWER=$(echo "${{ github.repository_owner }}/simforge" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-')

          TAGS="ghcr.io/${REPO_LOWER}:${BRANCH}"
          TAGS="${TAGS},ghcr.io/${REPO_LOWER}:${SHORT_SHA}"
          TAGS="${TAGS},ghcr.io/${REPO_LOWER}:${{ github.sha }}"

          # Only tag `latest` on main branch to keep latest stable
          if [ "${{ github.ref_name }}" = "main" ]; then
            TAGS="${TAGS},ghcr.io/${REPO_LOWER}:latest"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Computed tags:"
          echo "${TAGS}" | tr ',' '\n'

      - name: Build + push to GHCR (linux/amd64 for Cardinal compatibility)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=SimForge
            org.opencontainers.image.description=Reproducible cross-simulator benchmarking framework (SUMO + MATSim + DTALite)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Summary
        run: |
          echo "## SimForge container image published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tags pushed to GHCR:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pull on Cardinal:" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "singularity pull docker://ghcr.io/phanidharakula/simforge:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
