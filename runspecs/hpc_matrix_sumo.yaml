# HPC Experiment Matrix - Full Thesis Runs
# Based on thesis plan Section 4.1:
#   3 cities × 3 loads × 3 engines × 2 hardware × 10 repeats
#
# This file defines the SUMO portion of the experiment matrix.
# QarSUMO and MATSim adapters will have separate runspecs.
#
# Usage (on HPC with SLURM):
#   sbatch --wrap="python -m execution.run_benchmark runspecs/hpc_matrix_sumo.yaml"

name: hpc_thesis_matrix_sumo
description: "Full thesis experiment matrix for SUMO engine"
output_dir: /scratch/$USER/simforge/runs

runs:
  # ============================================================
  # CHICAGO - All Tiers
  # ============================================================
  
  # Chicago 50K - CPU
  - scenario_id: chicago_tier50k
    scenario_path: scenarios/chicago_tier50k
    engine: sumo
    environment: hpc
    mode: microscopic
    repeats: 10
    seed: 1000
    timeout_s: 14400
    engine_options:
      step_length: 1.0

  # Chicago 500K - CPU
  - scenario_id: chicago_tier500k
    scenario_path: scenarios/chicago_tier500k
    engine: sumo
    environment: hpc
    mode: microscopic
    repeats: 10
    seed: 2000
    timeout_s: 172800

  # Chicago 5M - CPU (long run)
  - scenario_id: chicago_tier5m
    scenario_path: scenarios/chicago_tier5m
    engine: sumo
    environment: hpc
    mode: microscopic
    repeats: 10
    seed: 3000
    timeout_s: 604800

  # ============================================================
  # NEW YORK CITY - All Tiers
  # ============================================================
  
  # NYC 50K - CPU
  - scenario_id: nyc_tier50k
    scenario_path: scenarios/nyc_tier50k
    engine: sumo
    environment: hpc
    mode: microscopic
    repeats: 10
    seed: 4000
    timeout_s: 14400

  # NYC 500K - CPU
  - scenario_id: nyc_tier500k
    scenario_path: scenarios/nyc_tier500k
    engine: sumo
    environment: hpc
    mode: microscopic
    repeats: 10
    seed: 5000
    timeout_s: 172800

  # NYC 5M - CPU (long run)
  - scenario_id: nyc_tier5m
    scenario_path: scenarios/nyc_tier5m
    engine: sumo
    environment: hpc
    mode: microscopic
    repeats: 10
    seed: 6000
    timeout_s: 604800

  # ============================================================
  # LOS ANGELES - All Tiers
  # ============================================================
  
  # LA 50K - CPU
  - scenario_id: la_tier50k
    scenario_path: scenarios/la_tier50k
    engine: sumo
    environment: hpc
    mode: microscopic
    repeats: 10
    seed: 7000
    timeout_s: 14400

  # LA 500K - CPU
  - scenario_id: la_tier500k
    scenario_path: scenarios/la_tier500k
    engine: sumo
    environment: hpc
    mode: microscopic
    repeats: 10
    seed: 8000
    timeout_s: 172800

  # LA 5M - CPU (long run)
  - scenario_id: la_tier5m
    scenario_path: scenarios/la_tier5m
    engine: sumo
    environment: hpc
    mode: microscopic
    repeats: 10
    seed: 9000
    timeout_s: 604800
