# Example Benchmark Run Specification
# This file defines which scenarios to run and how

name: thesis_benchmark_v1
description: "SimForge thesis benchmark: toy + Sioux Falls scenarios"
output_dir: runs

runs:
  # Toy scenario - quick validation runs
  - scenario_id: toy_2x2_grid
    scenario_path: scenarios/toy_2x2_grid
    engine: sumo
    environment: local_cpu
    repeats: 3
    seed: 42
    seed_increment: true
    timeout_s: 300

  # Sioux Falls - city-scale benchmark
  - scenario_id: sioux_falls_tier50k
    scenario_path: scenarios/sioux_falls_tier50k
    engine: sumo
    environment: local_cpu
    repeats: 5
    seed: 100
    seed_increment: true
    timeout_s: 7200
    engine_options:
      step_length: 1.0
      no_warnings: true
