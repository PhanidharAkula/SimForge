# SUMO-only 50k Benchmark Matrix - Mesoscopic Mode
# Working benchmark without MATSim (network connectivity issues)
# 
# Cities: sioux_falls_tier50k, austin_tier50k
# Engines: sumo, qarsumo
# Mode: mesoscopic only

name: sumo_50k_mesoscopic_benchmark
description: SUMO-only 50k tier benchmark (mesoscopic mode)
created: 2026-01-05

runs:
  # ============================================
  # SIOUX FALLS (City 1 - ~3k nodes, 50k trips)
  # ============================================
  - scenario_id: sioux_falls_sumo_meso
    scenario_path: scenarios/sioux_falls_tier50k
    engine: sumo
    mode: mesoscopic
    repeats: 3
    
  - scenario_id: sioux_falls_qarsumo_meso
    scenario_path: scenarios/sioux_falls_tier50k
    engine: qarsumo
    mode: mesoscopic
    repeats: 3

  # ============================================
  # AUSTIN TX (City 2 - ~45k nodes, 50k trips)
  # ============================================
  - scenario_id: austin_sumo_meso
    scenario_path: scenarios/austin_tier50k
    engine: sumo
    mode: mesoscopic
    repeats: 3
    