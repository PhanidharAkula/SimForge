# =============================================================================
# SimForge Pilot — chicago_200k_car SUMO microscopic (single seed)
# =============================================================================
#
# Single-cell pilot to measure SUMO micro engine_wall at the 200K-trip tier.
# Decision gate before committing to the full 5-seed micro matrix on
# chicago_200k_car. See doc/SIMULATION_PARADIGMS.md §6 for the rationale +
# wall-time projection method.
#
# Scope:       1 scenario × 1 engine × 1 mode × 1 seed = 1 cell
# Scenario:    chicago_200k_car (large tier, gitignored — rsync from dev box)
# Engine:      SUMO microscopic only (no MATSim/DTALite — those are meso-only)
# Mode:        microscopic (not in benchmark_large.yaml — that runspec is
#              meso-only by design at the 200K + tier)
# Seed:        42 only (pilot — N=5 matrix is a follow-up if pilot lands clean)
# Timeout:     172,800 s = 48 h (1.5× margin over 28-38 h projection)
#
# Why this pilot:
# ---------------
# The cross-engine fairness story at the large tier (§5.6.2 of the thesis
# chapter, Phase 14 results) compares SUMO meso vs MATSim qsim — both
# mesoscopic paradigms. SUMO micro is a within-engine resolution check that
# answers: "how much vehicle-level detail does meso throw away on a 200K-trip
# bundle?" If the pilot lands cleanly in <48 h wall, the full 5-seed micro
# matrix is feasible and produces the within-SUMO meso-vs-micro comparison
# at the headline scale (Chapter 5 §5.4 extension).
#
# Wall-time projection (from doc/SIMULATION_PARADIGMS.md §6):
#   chicago_1k_car SUMO micro engine_wall = 343 s on 1K trips
#   chicago_200k_car projection (linear)  = 343 × 200 = ~19 h
#   chicago_200k_car projection (super-linear, 1.5-2× for congestion) = 28-38 h
#   Pilot --time = 48 h provides 1.3-1.7× margin over the upper projection.
#
# Phase 14 cache state:
#   The canonical_routes BFS cache for chicago_200k_car was built by
#   job 9971041 (SUMO meso seed=42 cold). The pilot will hit that warm
#   cache and pay ~1 s prep instead of 6.5 h. Engine wall is the entire
#   cost; total cell wall ≈ engine wall.
#
# Memory estimate:
#   SUMO micro tracks per-vehicle state (lane, position, speed, accel).
#   chicago_200k Phase 14 SUMO meso peaked at ~23 GB. Micro is 2-5× heavier
#   on heap. Estimate 50-115 GB. --mem=128 G is conservative; Cardinal cpu
#   nodes have 503 G so margin is comfortable.
#
# Decision gate after pilot completes:
#   1. If engine_wall ≤ 30 h: GREEN — extend to 5-seed matrix via
#      `runspecs/pilot_chicago_200k_sumo_micro.yaml` with repeats: 5,
#      timeout_s: bumped to actual_wall + 20 % margin.
#   2. If engine_wall 30-48 h: YELLOW — 5-seed matrix needs 7-day wall
#      and 5 separate sbatchs (parallel). Doable but expensive in compute.
#      Document the constraint, decide based on remaining compute budget.
#   3. If engine_wall > 48 h (pilot times out): RED — micro is not
#      practical at 200K tier on current hardware. Document as a D-class
#      deviation in doc/DEVIATIONS.md and ship the chicago_1k +
#      nyc_10k micro data as the within-engine resolution finding.
#
# Output:
#   runs/pilots/chicago_200k_sumo_micro/
#   ├── benchmark_results_pilot_chicago_200k_sumo_micro.json
#   ├── reproducibility_scorecard.md  (auto-emitted; N=1 so no R metric)
#   └── chicago_200k_car/sumo/micro/seed_42/
#       ├── feasibility_report.json
#       ├── tripinfo.xml
#       ├── net.net.xml (hardlinked from canonical_routes cache)
#       └── ...
# =============================================================================

name: pilot_chicago_200k_sumo_micro
description: >
  Single-seed pilot for chicago_200k_car SUMO microscopic. Decision gate
  before committing to the full 5-seed micro matrix at the 200K tier.
output_dir: runs/pilots/chicago_200k_sumo_micro

runs:
  - {scenario_id: chicago_200k_car, scenario_path: scenarios/chicago_200k_car,
     engine: sumo, mode: microscopic, repeats: 1, seed: 42,
     seed_increment: false, timeout_s: 172800}
