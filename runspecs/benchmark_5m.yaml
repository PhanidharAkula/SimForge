# =============================================================================
# SimForge Benchmark — 5M Tier
# =============================================================================
#
# 3 cities × 3 engines × mesoscopic mode × 3 repeats = 27 runs
#
# Cities:   Chicago, New York City, Los Angeles
# Engines:  SUMO, QarSUMO, MATSim
# Tier:     5M trips (8-hour horizon)
#
# NOTE: 5M tier exceeds raw census commuter capacity for all cities.
#       Generation scripts require --allow-oversample or synthetic demand.
#       QarSUMO GPU acceleration strongly recommended at this scale.
# =============================================================================

name: benchmark_5m
description: >
  SimForge 5M-tier benchmark — three US cities evaluated across
  SUMO (mesoscopic), QarSUMO (mesoscopic, GPU-fallback), and MATSim.
  Extreme-scale scenarios; GPU acceleration recommended.
output_dir: runs/benchmark_5m

runs:
  # ----- Chicago -----
  - scenario_id: chicago_5m
    scenario_path: scenarios/chicago_5m
    engine: sumo
    mode: mesoscopic
    repeats: 3
    seed: 42
    seed_increment: true
    timeout_s: 7200

  - scenario_id: chicago_5m
    scenario_path: scenarios/chicago_5m
    engine: qarsumo
    mode: mesoscopic
    repeats: 3
    seed: 42
    seed_increment: true
    timeout_s: 7200

  - scenario_id: chicago_5m
    scenario_path: scenarios/chicago_5m
    engine: matsim
    mode: mesoscopic
    repeats: 3
    seed: 42
    seed_increment: true
    timeout_s: 7200

  # ----- New York City -----
  - scenario_id: nyc_5m
    scenario_path: scenarios/nyc_5m
    engine: sumo
    mode: mesoscopic
    repeats: 3
    seed: 42
    seed_increment: true
    timeout_s: 7200

  - scenario_id: nyc_5m
    scenario_path: scenarios/nyc_5m
    engine: qarsumo
    mode: mesoscopic
    repeats: 3
    seed: 42
    seed_increment: true
    timeout_s: 7200

  - scenario_id: nyc_5m
    scenario_path: scenarios/nyc_5m
    engine: matsim
    mode: mesoscopic
    repeats: 3
    seed: 42
    seed_increment: true
    timeout_s: 7200

  # ----- Los Angeles -----
  - scenario_id: la_5m
    scenario_path: scenarios/la_5m
    engine: sumo
    mode: mesoscopic
    repeats: 3
    seed: 42
    seed_increment: true
    timeout_s: 7200

  - scenario_id: la_5m
    scenario_path: scenarios/la_5m
    engine: qarsumo
    mode: mesoscopic
    repeats: 3
    seed: 42
    seed_increment: true
    timeout_s: 7200

  - scenario_id: la_5m
    scenario_path: scenarios/la_5m
    engine: matsim
    mode: mesoscopic
    repeats: 3
    seed: 42
    seed_increment: true
    timeout_s: 7200
