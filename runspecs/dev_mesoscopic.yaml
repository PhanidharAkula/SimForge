# Development Runspec - Mesoscopic Mode (Fast Iteration)
# Use this for local development, debugging, and pipeline validation
#
# Usage:
#   python -m execution.run_benchmark runspecs/dev_mesoscopic.yaml

name: dev_mesoscopic
description: "Fast development runs using mesoscopic simulation"
output_dir: runs/dev

runs:
  # Toy scenario - quick sanity check
  - scenario_id: toy_2x2_grid
    scenario_path: scenarios/toy_2x2_grid
    engine: sumo
    environment: local_cpu
    mode: mesoscopic
    repeats: 1
    seed: 42
    timeout_s: 60

  # Sioux Falls 50K - mesoscopic (~20 seconds)
  - scenario_id: sioux_falls_tier50k
    scenario_path: scenarios/sioux_falls_tier50k
    engine: sumo
    environment: local_cpu
    mode: mesoscopic
    repeats: 3
    seed: 100
    timeout_s: 300
    engine_options:
      step_length: 1.0
