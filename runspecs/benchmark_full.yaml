# =============================================================================
# SimForge Benchmark — Full Matrix (supercomputer)
# =============================================================================
#
# Scenarios:  all 5 tiers (chicago_1k, nyc_10k, la_50k, chicago_200k, nyc_500k)
# Engines:    SUMO, QarSUMO, MATSim
# Modes:      mesoscopic for everyone; microscopic for the small/medium tiers
#             (1k, 10k, 50k) only — micro at 200k/500k would not finish inside
#             a 12-hour SLURM wall.
# Repeats:    3 for SUMO/QarSUMO, 2 for MATSim (matches stress_test.yaml).
# Total:      29 entries → ~78 simulator invocations.
#
# Designed for parallel-by-scenario launch via cluster/jobs/benchmark_full.sbatch
# (5 backgrounded `python -m execution.run_benchmark` processes, one per
# scenario, each with its own --output dir to avoid JSON collisions).
#
# Prerequisites on Pitzer:
#   - The two large bundles (chicago_200k_car_transit, nyc_500k_car) must be
#     present under scenarios/ — they're gitignored, rsync from your dev box
#     after generating locally with scripts/04_large_full_day.py and
#     scripts/05_stress_test.py.
#   - GPU partition required for QarSUMO acceleration (sbatch handles this).
# =============================================================================

name: benchmark_full
description: >
  Full SimForge benchmark across all five scenario tiers and all three
  engines, in mesoscopic mode for everyone plus microscopic for the small
  and medium tiers. Reproduces the canonical thesis matrix.
output_dir: runs/benchmark_full

runs:
  # ---------------------------------------------------------------- chicago_1k
  - {scenario_id: chicago_1k_car, scenario_path: scenarios/chicago_1k_car,
     engine: sumo,    mode: mesoscopic,  repeats: 3, seed: 42, seed_increment: true, timeout_s: 60}
  - {scenario_id: chicago_1k_car, scenario_path: scenarios/chicago_1k_car,
     engine: sumo,    mode: microscopic, repeats: 3, seed: 42, seed_increment: true, timeout_s: 600}
  - {scenario_id: chicago_1k_car, scenario_path: scenarios/chicago_1k_car,
     engine: qarsumo, mode: mesoscopic,  repeats: 3, seed: 42, seed_increment: true, timeout_s: 60}
  - {scenario_id: chicago_1k_car, scenario_path: scenarios/chicago_1k_car,
     engine: qarsumo, mode: microscopic, repeats: 3, seed: 42, seed_increment: true, timeout_s: 600}
  - {scenario_id: chicago_1k_car, scenario_path: scenarios/chicago_1k_car,
     engine: matsim,  mode: mesoscopic,  repeats: 2, seed: 42, seed_increment: true, timeout_s: 300}

  # ----------------------------------------------------------------- nyc_10k
  - {scenario_id: nyc_10k_car, scenario_path: scenarios/nyc_10k_car,
     engine: sumo,    mode: mesoscopic,  repeats: 3, seed: 42, seed_increment: true, timeout_s: 600}
  - {scenario_id: nyc_10k_car, scenario_path: scenarios/nyc_10k_car,
     engine: sumo,    mode: microscopic, repeats: 3, seed: 42, seed_increment: true, timeout_s: 3600}
  - {scenario_id: nyc_10k_car, scenario_path: scenarios/nyc_10k_car,
     engine: qarsumo, mode: mesoscopic,  repeats: 3, seed: 42, seed_increment: true, timeout_s: 600}
  - {scenario_id: nyc_10k_car, scenario_path: scenarios/nyc_10k_car,
     engine: qarsumo, mode: microscopic, repeats: 3, seed: 42, seed_increment: true, timeout_s: 3600}
  - {scenario_id: nyc_10k_car, scenario_path: scenarios/nyc_10k_car,
     engine: matsim,  mode: mesoscopic,  repeats: 2, seed: 42, seed_increment: true, timeout_s: 600}

  # ---------------------------------------------------- la_50k_bike_car_transit
  - {scenario_id: la_50k_bike_car_transit, scenario_path: scenarios/la_50k_bike_car_transit,
     engine: sumo,    mode: mesoscopic,  repeats: 3, seed: 42, seed_increment: true, timeout_s: 1800}
  - {scenario_id: la_50k_bike_car_transit, scenario_path: scenarios/la_50k_bike_car_transit,
     engine: sumo,    mode: microscopic, repeats: 3, seed: 42, seed_increment: true, timeout_s: 14400}
  - {scenario_id: la_50k_bike_car_transit, scenario_path: scenarios/la_50k_bike_car_transit,
     engine: qarsumo, mode: mesoscopic,  repeats: 3, seed: 42, seed_increment: true, timeout_s: 1800}
  - {scenario_id: la_50k_bike_car_transit, scenario_path: scenarios/la_50k_bike_car_transit,
     engine: qarsumo, mode: microscopic, repeats: 3, seed: 42, seed_increment: true, timeout_s: 14400}
  - {scenario_id: la_50k_bike_car_transit, scenario_path: scenarios/la_50k_bike_car_transit,
     engine: matsim,  mode: mesoscopic,  repeats: 2, seed: 42, seed_increment: true, timeout_s: 1800}

  # ---------------------------------------------------- chicago_200k_car_transit
  # Mesoscopic only — microscopic at 200K trips would not finish in 12 h.
  - {scenario_id: chicago_200k_car_transit, scenario_path: scenarios/chicago_200k_car_transit,
     engine: sumo,    mode: mesoscopic, repeats: 3, seed: 42, seed_increment: true, timeout_s: 3600}
  - {scenario_id: chicago_200k_car_transit, scenario_path: scenarios/chicago_200k_car_transit,
     engine: qarsumo, mode: mesoscopic, repeats: 3, seed: 42, seed_increment: true, timeout_s: 3600}
  - {scenario_id: chicago_200k_car_transit, scenario_path: scenarios/chicago_200k_car_transit,
     engine: matsim,  mode: mesoscopic, repeats: 2, seed: 42, seed_increment: true, timeout_s: 3600}

  # ----------------------------------------------------------------- nyc_500k
  # Mesoscopic only — microscopic at 500K trips is impractical.
  - {scenario_id: nyc_500k_car, scenario_path: scenarios/nyc_500k_car,
     engine: sumo,    mode: mesoscopic, repeats: 3, seed: 42, seed_increment: true, timeout_s: 7200}
  - {scenario_id: nyc_500k_car, scenario_path: scenarios/nyc_500k_car,
     engine: qarsumo, mode: mesoscopic, repeats: 3, seed: 42, seed_increment: true, timeout_s: 7200}
  - {scenario_id: nyc_500k_car, scenario_path: scenarios/nyc_500k_car,
     engine: matsim,  mode: mesoscopic, repeats: 2, seed: 42, seed_increment: true, timeout_s: 7200}
