# =============================================================================
# SimForge Benchmark — 500K Tier
# =============================================================================
#
# 3 cities × 3 engines × mesoscopic mode × 3 repeats = 27 runs
#
# Cities:   Chicago, New York City, Los Angeles
# Engines:  SUMO, QarSUMO, MATSim
# Tier:     500K trips (4-hour horizon)
# =============================================================================

name: benchmark_500k
description: >
  SimForge 500K-tier benchmark — three US cities evaluated across
  SUMO (mesoscopic), QarSUMO (mesoscopic, GPU-fallback), and MATSim.
  Large-scale scenarios requiring significant compute resources.
output_dir: runs/benchmark_500k

runs:
  # ----- Chicago -----
  - scenario_id: chicago_500k
    scenario_path: scenarios/chicago_500k
    engine: sumo
    mode: mesoscopic
    repeats: 3
    seed: 42
    seed_increment: true
    timeout_s: 3600

  - scenario_id: chicago_500k
    scenario_path: scenarios/chicago_500k
    engine: qarsumo
    mode: mesoscopic
    repeats: 3
    seed: 42
    seed_increment: true
    timeout_s: 3600

  - scenario_id: chicago_500k
    scenario_path: scenarios/chicago_500k
    engine: matsim
    mode: mesoscopic
    repeats: 3
    seed: 42
    seed_increment: true
    timeout_s: 3600

  # ----- New York City -----
  - scenario_id: nyc_500k
    scenario_path: scenarios/nyc_500k
    engine: sumo
    mode: mesoscopic
    repeats: 3
    seed: 42
    seed_increment: true
    timeout_s: 3600

  - scenario_id: nyc_500k
    scenario_path: scenarios/nyc_500k
    engine: qarsumo
    mode: mesoscopic
    repeats: 3
    seed: 42
    seed_increment: true
    timeout_s: 3600

  - scenario_id: nyc_500k
    scenario_path: scenarios/nyc_500k
    engine: matsim
    mode: mesoscopic
    repeats: 3
    seed: 42
    seed_increment: true
    timeout_s: 3600

  # ----- Los Angeles -----
  - scenario_id: la_500k
    scenario_path: scenarios/la_500k
    engine: sumo
    mode: mesoscopic
    repeats: 3
    seed: 42
    seed_increment: true
    timeout_s: 3600

  - scenario_id: la_500k
    scenario_path: scenarios/la_500k
    engine: qarsumo
    mode: mesoscopic
    repeats: 3
    seed: 42
    seed_increment: true
    timeout_s: 3600

  - scenario_id: la_500k
    scenario_path: scenarios/la_500k
    engine: matsim
    mode: mesoscopic
    repeats: 3
    seed: 42
    seed_increment: true
    timeout_s: 3600
