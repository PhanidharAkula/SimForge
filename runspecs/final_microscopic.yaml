# Final Experiments Runspec - Microscopic Mode (Accurate)
# Use this for final thesis experiments on HPC
#
# Estimated runtimes (per run):
#   - 50K trips:  ~3-4 hours (CPU)
#   - 500K trips: ~30-40 hours (CPU), needs HPC
#   - 5M trips:   ~2-3 days (CPU), needs HPC cluster
#
# Usage:
#   python -m execution.run_benchmark runspecs/final_microscopic.yaml

name: thesis_final_microscopic
description: "Final thesis experiments - microscopic simulation for accuracy"
output_dir: runs/final

runs:
  # ============================================================
  # TOY SCENARIO - Validation baseline
  # ============================================================
  - scenario_id: toy_2x2_grid
    scenario_path: scenarios/toy_2x2_grid
    engine: sumo
    environment: local_cpu
    mode: microscopic
    repeats: 10  # For reproducibility analysis (R = 1 - σ/μ)
    seed: 42
    timeout_s: 300

  # ============================================================
  # SIOUX FALLS 50K - Tier 1 (Local CPU feasible)
  # ============================================================
  - scenario_id: sioux_falls_tier50k
    scenario_path: scenarios/sioux_falls_tier50k
    engine: sumo
    environment: local_cpu
    mode: microscopic
    repeats: 10
    seed: 100
    seed_increment: true
    timeout_s: 14400  # 4 hours
    engine_options:
      step_length: 1.0
      no_warnings: true

  # ============================================================
  # CITY 1 - 500K (HPC Required)
  # Uncomment when HPC access available
  # ============================================================
  # - scenario_id: chicago_tier500k
  #   scenario_path: scenarios/chicago_tier500k
  #   engine: sumo
  #   environment: hpc
  #   mode: microscopic
  #   repeats: 10
  #   seed: 200
  #   timeout_s: 172800  # 48 hours
  #   engine_options:
  #     step_length: 1.0
  #     no_warnings: true

  # ============================================================
  # CITY 1 - 5M (HPC Cluster Required)
  # Uncomment when HPC cluster access available
  # ============================================================
  # - scenario_id: chicago_tier5m
  #   scenario_path: scenarios/chicago_tier5m
  #   engine: sumo
  #   environment: hpc
  #   mode: microscopic
  #   repeats: 10
  #   seed: 300
  #   timeout_s: 604800  # 7 days
