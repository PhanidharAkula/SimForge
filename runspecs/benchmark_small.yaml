# =============================================================================
# SimForge Benchmark — Small Tier (canonical "is everything green?" matrix)
# =============================================================================
#
# Scenarios:  chicago_1k_car, nyc_10k_car, la_50k_bike_car_transit
# Engines:    SUMO, MATSim
# Modes:      mesoscopic for both engines, plus microscopic for SUMO on every
#             scenario. MATSim is mesoscopic-only by design.
# Repeats:    3 for SUMO, 2 for MATSim (matches stress_test.yaml).
# Total:      9 entries → ~24 simulator invocations.
#
# This is the matrix you can actually finish in a single SLURM wall.
# Designed for parallel-by-scenario launch via cluster/jobs/benchmark_small.sbatch
# (3 backgrounded `python -m execution.run_benchmark` processes, one per
# scenario, each with its own --output dir).
#
# Note: the plan commits to a 3rd primary engine (LPSim, GPU). Once the
# LPSim adapter lands (todo.md Phase B), it'll appear here as a third row per
# scenario and the sbatch will switch back to a GPU partition.
#
# Prerequisites:
#   - All 3 bundles are tracked in git — `git pull` brings them down.
# =============================================================================

name: benchmark_small
description: >
  SimForge small-tier benchmark across the three reference scenarios
  (chicago_1k_car, nyc_10k_car, la_50k_bike_car_transit) with SUMO + MATSim
  in mesoscopic, plus microscopic for SUMO.
output_dir: runs/benchmark_small

runs:
  # ---------------------------------------------------------------- chicago_1k
  - {scenario_id: chicago_1k_car, scenario_path: scenarios/chicago_1k_car,
     engine: sumo,    mode: mesoscopic,  repeats: 3, seed: 42, seed_increment: true, timeout_s: 60}
  - {scenario_id: chicago_1k_car, scenario_path: scenarios/chicago_1k_car,
     engine: sumo,    mode: microscopic, repeats: 3, seed: 42, seed_increment: true, timeout_s: 600}
  - {scenario_id: chicago_1k_car, scenario_path: scenarios/chicago_1k_car,
     engine: matsim,  mode: mesoscopic,  repeats: 2, seed: 42, seed_increment: true, timeout_s: 300}

  # ----------------------------------------------------------------- nyc_10k
  - {scenario_id: nyc_10k_car, scenario_path: scenarios/nyc_10k_car,
     engine: sumo,    mode: mesoscopic,  repeats: 3, seed: 42, seed_increment: true, timeout_s: 600}
  - {scenario_id: nyc_10k_car, scenario_path: scenarios/nyc_10k_car,
     engine: sumo,    mode: microscopic, repeats: 3, seed: 42, seed_increment: true, timeout_s: 3600}
  - {scenario_id: nyc_10k_car, scenario_path: scenarios/nyc_10k_car,
     engine: matsim,  mode: mesoscopic,  repeats: 2, seed: 42, seed_increment: true, timeout_s: 600}

  # ---------------------------------------------------- la_50k_bike_car_transit
  - {scenario_id: la_50k_bike_car_transit, scenario_path: scenarios/la_50k_bike_car_transit,
     engine: sumo,    mode: mesoscopic,  repeats: 3, seed: 42, seed_increment: true, timeout_s: 1800}
  - {scenario_id: la_50k_bike_car_transit, scenario_path: scenarios/la_50k_bike_car_transit,
     engine: sumo,    mode: microscopic, repeats: 3, seed: 42, seed_increment: true, timeout_s: 14400}
  - {scenario_id: la_50k_bike_car_transit, scenario_path: scenarios/la_50k_bike_car_transit,
     engine: matsim,  mode: mesoscopic,  repeats: 2, seed: 42, seed_increment: true, timeout_s: 1800}
