# =============================================================================
# SimForge Benchmark — Large Tier (supercomputer)
# =============================================================================
#
# Scenarios:  chicago_200k_car, nyc_500k_car
# Engines:    SUMO + MATSim only (mesoscopic).
# Modes:      mesoscopic only — microscopic at 200K+ trips would not finish
#             in any reasonable wall.
# Repeats:    5 across the board.
# Total:      4 entries → 20 simulator invocations.
#
# Submit with cluster/jobs/benchmark_large.sbatch (parallel by scenario,
# 2 backgrounded workers, --output-isolated). Bundles must be present:
# both 200K and 500K are gitignored, rsync from your dev box first. The
# per-scenario fallback sbatchs (benchmark_large_chicago_200k.sbatch +
# benchmark_large_nyc_500k.sbatch) were Phase 13.2 wall-margin insurance
# and have been deleted under Phase 14 — the umbrella is now sole.
#
# ⚠️ DTALite excluded at this tier (Phase 12.5 decision, 2026-05-03).
#    The bundled path4gmns 0.10.0 DTALite C++ binary caps internal OpenMP
#    at 4 threads regardless of OMP_NUM_THREADS / SLURM cpus-per-task.
#    Extrapolating from la_50k_car observed ~25 h/seed:
#      chicago_200k_car DTALite ≈ ~100 h/seed (5 seeds = 500 h cumulative)
#      nyc_500k_car     DTALite ≈ ~250 h/seed (5 seeds = 1,250 h cumulative)
#    Both structurally exceed any practical Pitzer walltime. Phase 14
#    does NOT help DTALite — it computes its own routes via UE/SUE
#    iteration, doesn't use pre-routed BFS. Documented as a path4gmns
#    binary-side scalability ceiling in CHANGELOG Phase 12.5 and
#    doc/chapters/results.md §5.7. Future work: replace bundled binary
#    with a multi-thread DTALite build, or evaluate `path4gmns.find_ue`
#    (pure-Python solver) — see CHANGELOG Phase 12.7.
#
# 📝 BFS-prep wall (Phase 14 canonical_routes cache + parallel BFS):
#    Phase 14.4 hoisted BFS routing out of each adapter into a single
#    multiprocessing.Pool pass per scenario, written to
#    runs/<runspec>/<scenario>/.canonical_routes/ and consumed by both
#    SUMO and MATSim adapters. Phase 14.12 collapsed MATSim's
#    find_link_for_* from O(N) → O(1) (the dominant cold-prep cost).
#    Measured walls:
#      chicago_200k_car: cold ~6.5 h BFS + 10 cells × ~200-245 s sim
#                        ≈ ~7.1 h cold-cache total
#                        ≈ ~37 min warm-cache re-run
#      nyc_500k_car:     cold ~20 h BFS (projected, 24 workers, ~2.5 M
#                        SCC links) + 10 cells × ~3-5 min sim
#                        ≈ ~22 h cold-cache total
#                        ≈ ~1-2 h warm-cache re-run
#    See doc/EXPERIMENT_LOG.md 2026-05-19 entry for the Phase 13 vs
#    Phase 14 cold-vs-cold (~20×) and warm-cache re-run (~228×)
#    speedup comparison.
# =============================================================================

name: benchmark_large
description: >
  SimForge large-tier benchmark — 200K and 500K trip scenarios for
  supercomputer execution. SUMO + MATSim only; DTALite excluded due to
  path4gmns 0.10.0 4-thread cap (CHANGELOG Phase 12.5).
output_dir: runs/benchmark_large

runs:
  # ---------------------------------------------------- chicago_200k_car
  - {scenario_id: chicago_200k_car, scenario_path: scenarios/chicago_200k_car,
     engine: sumo,    mode: mesoscopic, repeats: 5, seed: 42, seed_increment: true, timeout_s: 3600}
  - {scenario_id: chicago_200k_car, scenario_path: scenarios/chicago_200k_car,
     engine: matsim,  mode: mesoscopic, repeats: 5, seed: 42, seed_increment: true, timeout_s: 3600,
     engine_options: {heap_gb: 32}}

  # ----------------------------------------------------------------- nyc_500k
  - {scenario_id: nyc_500k_car, scenario_path: scenarios/nyc_500k_car,
     engine: sumo,    mode: mesoscopic, repeats: 5, seed: 42, seed_increment: true, timeout_s: 7200}
  - {scenario_id: nyc_500k_car, scenario_path: scenarios/nyc_500k_car,
     engine: matsim,  mode: mesoscopic, repeats: 5, seed: 42, seed_increment: true, timeout_s: 7200,
     engine_options: {heap_gb: 64}}

# heap_gb sizing rationale (Phase 13.2, Cardinal):
#   MATSim adapter default -Xmx is 4 GB (adapters/matsim/matsim_adapter.py:46).
#   For chicago_200k_car: 200K trips × ~1.5 KB per QSim PersonVehicle (heap-
#   resident at AM peak) ~ 300 MB live set; 32 GB heap leaves comfortable GC
#   headroom (8x live-set heuristic) so the JVM avoids minor-GC thrash.
#   For nyc_500k_car: 500K trips × same per-vehicle footprint ~ 750 MB live
#   set; 64 GB heap = same 8x headroom + accommodates peak queue burst.
#   Both well within the --mem=480G allocation Cardinal's cpu/longcpu nodes
#   provide. Drop back to default 4 GB if the cluster budget tightens or
#   the bench shows no GC-bound MATSim cells.
