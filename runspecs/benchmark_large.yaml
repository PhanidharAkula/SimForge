# =============================================================================
# SimForge Benchmark — Large Tier (supercomputer)
# =============================================================================
#
# Scenarios:  chicago_200k_car, nyc_500k_car
# Engines:    SUMO + MATSim only (mesoscopic).
# Modes:      mesoscopic only — microscopic at 200K+ trips would not finish
#             in any reasonable wall.
# Repeats:    5 across the board.
# Total:      4 entries → 20 simulator invocations.
#
# Submit with cluster/jobs/benchmark_large.sbatch (parallel by scenario,
# 2 backgrounded workers, --output-isolated). Bundles must be present:
# both 200K and 500K are gitignored, rsync from your dev box first.
#
# ⚠️ DTALite excluded at this tier (Phase 12.5 decision, 2026-05-03).
#    The bundled path4gmns 0.10.0 DTALite C++ binary caps internal OpenMP
#    at 4 threads regardless of OMP_NUM_THREADS / SLURM cpus-per-task.
#    Extrapolating from la_50k_car observed ~25 h/seed:
#      chicago_200k_car DTALite ≈ ~100 h/seed (5 seeds = 500 h cumulative)
#      nyc_500k_car     DTALite ≈ ~250 h/seed (5 seeds = 1,250 h cumulative)
#    Both structurally exceed any practical Pitzer walltime. Documented
#    as a path4gmns binary-side scalability ceiling in CHANGELOG Phase 12.5
#    and discussed in doc/chapters/results.md §5.7. Future work: replace
#    bundled binary with a multi-thread DTALite build, or evaluate
#    `path4gmns.find_ue` (pure-Python solver) — see CHANGELOG Phase 12.7.
#
# 📝 BFS-prep wall (Phase 12+ cache): the SUMO/MATSim adapter pre-routes
#    every trip via BFS once per (scenario, engine), then hardlinks the
#    cached prep into all N seed dirs. For chicago_200k:
#      cold BFS-prep ≈ ~30-40 h per engine
#      cached mobsim ≈ ~6-12 min per seed
#    Total: ~30-40 h prep + 5 × cached cells per engine × 2 engines.
#    Use `cluster/jobs/benchmark_large.sbatch` with --time=7-00:00:00
#    and --mem=128G. nyc_500k extrapolates to ~80-110 h prep per engine
#    — uncomfortably close to the 7-day cap; consider --partition=hugemem
#    if memory becomes the constraint.
# =============================================================================

name: benchmark_large
description: >
  SimForge large-tier benchmark — 200K and 500K trip scenarios for
  supercomputer execution. SUMO + MATSim only; DTALite excluded due to
  path4gmns 0.10.0 4-thread cap (CHANGELOG Phase 12.5).
output_dir: runs/benchmark_large

runs:
  # ---------------------------------------------------- chicago_200k_car
  - {scenario_id: chicago_200k_car, scenario_path: scenarios/chicago_200k_car,
     engine: sumo,    mode: mesoscopic, repeats: 5, seed: 42, seed_increment: true, timeout_s: 3600}
  - {scenario_id: chicago_200k_car, scenario_path: scenarios/chicago_200k_car,
     engine: matsim,  mode: mesoscopic, repeats: 5, seed: 42, seed_increment: true, timeout_s: 3600}

  # ----------------------------------------------------------------- nyc_500k
  - {scenario_id: nyc_500k_car, scenario_path: scenarios/nyc_500k_car,
     engine: sumo,    mode: mesoscopic, repeats: 5, seed: 42, seed_increment: true, timeout_s: 7200}
  - {scenario_id: nyc_500k_car, scenario_path: scenarios/nyc_500k_car,
     engine: matsim,  mode: mesoscopic, repeats: 5, seed: 42, seed_increment: true, timeout_s: 7200}
