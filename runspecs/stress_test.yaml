name: stress_test
description: End-to-end stress test across all engines and modes.
output_dir: runs/stress_test

runs:
  - scenario_id: chicago_1k_car
    scenario_path: scenarios/chicago_1k_car
    engine: sumo
    mode: mesoscopic
    repeats: 3
    seed: 42
    timeout_s: 300

  - scenario_id: chicago_1k_car
    scenario_path: scenarios/chicago_1k_car
    engine: sumo
    mode: microscopic
    repeats: 3
    seed: 42
    timeout_s: 300

  - scenario_id: chicago_1k_car
    scenario_path: scenarios/chicago_1k_car
    engine: matsim
    mode: mesoscopic
    repeats: 2
    seed: 42
    timeout_s: 600
